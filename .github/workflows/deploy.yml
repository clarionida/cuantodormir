# Publica el sitio en GitHub Pages cada vez que se guarda un cambio en main.
# 1) Pruebas: comprueba que la calculadora da los resultados esperados.
# 2) Compilar: genera el sitio con la acción oficial de Astro y lo revisa.
# 3) Publicar: lo sube a GitHub Pages.
# 4) Avisar a Bing (IndexNow), solo si lo activaste en src/config/sitio.ts.
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pruebas:
    name: Pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  compilar:
    name: Compilar
    needs: pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar con la acción oficial de Astro
        uses: withastro/action@v3
        with:
          node-version: 22

  publicar:
    name: Publicar
    needs: compilar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  indexnow:
    name: Avisar a Bing (IndexNow)
    needs: publicar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/indexnow.mjs
